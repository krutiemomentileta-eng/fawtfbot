<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>⭐ Tap & Win!</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      .hidden {
        display: none !important;
      }

      /* LOADING */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .loading-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #eee;
        border-top: 3px solid #ffd700;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loading-text {
        color: #bbb;
        font-size: 13px;
        margin-top: 14px;
      }

      /* FLASH */
      #flash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        z-index: 999;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.8s;
      }

      /* MAIN */
      #main-scene {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2;
        will-change: transform;
      }
      #star-area {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 260px;
        height: 260px;
        contain: layout style;
      }

      .ray {
        position: absolute;
        top: 48%;
        left: 50%;
        width: 3px;
        height: 130px;
        transform-origin: bottom center;
        transform: translate(-50%, -100%) rotate(calc(var(--i) * 30deg));
        background: linear-gradient(
          to top,
          rgba(255, 215, 0, 0.6),
          rgba(255, 215, 0, 0)
        );
        border-radius: 2px;
        will-change: opacity;
        animation: ray-pulse 2s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.1s);
      }
      @keyframes ray-pulse {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 0.7;
        }
      }

      #glow {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 215, 0, 0.35) 0%,
          rgba(255, 215, 0, 0.15) 40%,
          transparent 70%
        );
        will-change: transform, opacity;
        animation: glow-breathe 3s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes glow-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.3);
          opacity: 1;
        }
      }

      #star-wrapper {
        position: relative;
        cursor: pointer;
        z-index: 10;
        width: 140px;
        height: 140px;
        touch-action: manipulation;
      }
      #star-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 90px;
        will-change: transform;
        contain: layout style;
      }
      #pulse-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 150px;
        height: 150px;
        border: 2px solid rgba(255, 215, 0, 0.25);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        will-change: transform, opacity;
        animation: pulse-expand 2.5s ease-out infinite;
        pointer-events: none;
      }
      @keyframes pulse-expand {
        0% {
          transform: translate(-50%, -50%) scale(0.8);
          opacity: 0.8;
        }
        100% {
          transform: translate(-50%, -50%) scale(2);
          opacity: 0;
        }
      }

      #tap-text {
        margin-top: 20px;
        font-size: 26px;
        font-weight: 800;
        color: #333;
        letter-spacing: 2px;
      }
      .bounce-letter {
        display: inline-block;
        animation: letter-bounce 1.5s ease-in-out infinite;
        animation-delay: calc(var(--d) * 0.08s);
      }
      @keyframes letter-bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        25% {
          transform: translateY(-6px);
        }
      }

      #tap-counter {
        margin-top: 16px;
        text-align: center;
      }
      #progress-bar {
        width: 180px;
        height: 6px;
        background: #e0e0e0;
        border-radius: 3px;
        overflow: hidden;
        margin: 0 auto 6px;
      }
      #progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ffd700, #ffa500);
        border-radius: 3px;
        transition: width 0.15s ease-out;
      }

      .particle {
        position: fixed;
        pointer-events: none;
        z-index: 50;
        border-radius: 50%;
        will-change: transform, opacity;
        animation: p-fly 0.6s ease-out forwards;
        contain: strict;
      }
      @keyframes p-fly {
        0% {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) scale(0);
        }
      }

      .tap-effect {
        position: fixed;
        font-size: 22px;
        font-weight: 900;
        color: #ffd700;
        pointer-events: none;
        z-index: 100;
        will-change: transform, opacity;
        animation: tap-fly 0.5s ease-out forwards;
        contain: strict;
      }
      @keyframes tap-fly {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-50px) scale(1.2);
        }
      }

      /* ROULETTE */
      #roulette-scene {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      #roulette-title {
        font-size: 22px;
        font-weight: 700;
        color: #333;
        margin-bottom: 30px;
      }
      #roulette-wrapper {
        position: relative;
        width: 92%;
        max-width: 450px;
      }
      #roulette-viewport {
        width: 100%;
        height: 120px;
        overflow: hidden;
        border-radius: 16px;
        background: #fafafa;
        border: 1px solid #eee;
        position: relative;
        contain: layout style paint;
      }
      #roulette-strip {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        will-change: transform;
      }
      .roulette-item {
        position: absolute;
        top: 10px;
        width: 96px;
        height: 96px;
        border: 2.5px solid #d0d0d0;
        border-radius: 14px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        contain: layout style paint;
      }
      .roulette-sticker {
        width: 72px;
        height: 72px;
      }
      .roulette-emoji {
        font-size: 42px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
      }
      #roulette-pointer-top {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 11px solid transparent;
        border-right: 11px solid transparent;
        border-top: 14px solid #ffd700;
        z-index: 10;
      }
      #roulette-pointer-bottom {
        position: absolute;
        bottom: -14px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 11px solid transparent;
        border-right: 11px solid transparent;
        border-bottom: 14px solid #ffd700;
        z-index: 10;
      }
      #roulette-line {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        background: rgba(255, 215, 0, 0.5);
        transform: translateX(-50%);
        z-index: 10;
        pointer-events: none;
      }

      /* MODALS */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
      }
      .modal-box {
        background: white;
        border-radius: 24px;
        padding: 30px 24px;
        text-align: center;
        max-width: 340px;
        width: 90%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-box h2 {
        font-size: 20px;
        color: #888;
        margin-bottom: 14px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .modal-sticker {
        width: 120px;
        height: 120px;
        margin: 0 auto 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 65px;
      }
      .modal-prize-name {
        font-size: 20px;
        font-weight: 800;
        color: #333;
        margin-bottom: 20px;
      }
      .btn-primary {
        position: relative;
        width: 100%;
        padding: 15px;
        font-size: 16px;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, #ffd700, #ffa500);
        border: none;
        border-radius: 14px;
        cursor: pointer;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(255, 165, 0, 0.3);
        transition: transform 0.1s;
      }
      .btn-primary:active {
        transform: scale(0.95);
      }
      .btn-primary:disabled {
        opacity: 0.6;
        pointer-events: none;
      }
      .btn-shine {
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: shine-move 2.5s ease-in-out infinite;
      }
      @keyframes shine-move {
        0% {
          left: -100%;
        }
        50%,
        100% {
          left: 100%;
        }
      }

      .subscribe-desc {
        font-size: 14px;
        color: #666;
        margin-bottom: 18px;
        line-height: 1.5;
      }
      .channel-list {
        list-style: none;
        margin-bottom: 20px;
      }
      .channel-item {
        display: flex;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .channel-item:last-child {
        border-bottom: none;
      }
      .channel-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #e0e0e0;
        margin-right: 12px;
        flex-shrink: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #999;
      }
      .channel-avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
      }
      .channel-info {
        flex: 1;
        text-align: left;
        min-width: 0;
      }
      .channel-name {
        font-size: 14px;
        font-weight: 600;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .channel-type-badge {
        font-size: 11px;
        color: #999;
        margin-top: 2px;
      }
      .channel-sub-btn {
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #3390ec;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        flex-shrink: 0;
        margin-left: 10px;
      }
      .channel-sub-btn.bot-btn {
        background: #9b59b6;
      }
      .channel-sub-btn.done {
        background: #4caf50;
        pointer-events: none;
      }

      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: #ff4757;
        color: white;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        z-index: 9999;
        transition: transform 0.3s ease;
        pointer-events: none;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
      .toast.success {
        background: #4caf50;
      }

      .final-icon {
        font-size: 50px;
        margin-bottom: 15px;
      }
      .final-title {
        font-size: 18px;
        font-weight: 700;
        color: #333;
        margin-bottom: 10px;
      }
      .final-text {
        font-size: 14px;
        color: #888;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-spinner"></div>
      <p class="loading-text">Загрузка...</p>
    </div>
    <div id="flash"></div>
    <div id="toast" class="toast"></div>

    <!-- TAP -->
    <div id="main-scene" class="hidden">
      <div id="star-area">
        <div id="rays-container"></div>
        <div id="glow"></div>
        <div id="star-wrapper">
          <div id="star-container"></div>
          <div id="pulse-ring"></div>
        </div>
      </div>
      <div id="tap-text">
        <span class="bounce-letter" style="--d: 0">Ж</span
        ><span class="bounce-letter" style="--d: 1">м</span
        ><span class="bounce-letter" style="--d: 2">и</span
        ><span class="bounce-letter" style="--d: 3">&nbsp;</span
        ><span class="bounce-letter" style="--d: 4">ж</span
        ><span class="bounce-letter" style="--d: 5">м</span
        ><span class="bounce-letter" style="--d: 6">и</span
        ><span class="bounce-letter" style="--d: 7">!</span>
      </div>
      <div id="tap-counter">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <span id="counter-text">0 / 10</span>
      </div>
    </div>

    <!-- ROULETTE -->
    <div id="roulette-scene" class="hidden">
      <div id="roulette-title">🎰 Крутим рулетку...</div>
      <div id="roulette-wrapper">
        <div id="roulette-pointer-top"></div>
        <div id="roulette-pointer-bottom"></div>
        <div id="roulette-line"></div>
        <div id="roulette-viewport">
          <div id="roulette-strip"></div>
        </div>
      </div>
    </div>

    <!-- MODALS -->
    <div id="modal-prize" class="modal-overlay hidden">
      <div class="modal-box">
        <h2>ВАМ ВЫПАЛ:</h2>
        <div id="modal-prize-sticker" class="modal-sticker"></div>
        <p id="modal-prize-name" class="modal-prize-name"></p>
        <button id="btn-claim" class="btn-primary">
          <span>ЗАБРАТЬ</span><span class="btn-shine"></span>
        </button>
      </div>
    </div>

    <div id="modal-subscribe" class="modal-overlay hidden">
      <div class="modal-box">
        <h2>🎁 Получите приз!</h2>
        <div id="sub-sticker" class="modal-sticker"></div>
        <p id="sub-prize-name" class="modal-prize-name"></p>
        <p class="subscribe-desc">
          Чтобы получить приз, подпишитесь на&nbsp;наших спонсоров:
        </p>
        <ul id="channel-list" class="channel-list"></ul>
        <button id="btn-check-sub" class="btn-primary">
          <span>Проверить подписку</span><span class="btn-shine"></span>
        </button>
      </div>
    </div>

    <div id="modal-final" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="final-icon">✅</div>
        <div id="final-sticker" class="modal-sticker"></div>
        <p id="final-prize-name" class="modal-prize-name"></p>
        <h3 class="final-title">ЗАЯВКА НА ВЫВОД ПРИЗА ОТПРАВЛЕНА!</h3>
        <p class="final-text">
          Приз будет выдан в течение 24 часов.<br />Спасибо за участие! 🎉
        </p>
      </div>
    </div>

    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"
    ></script>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"
    ></script>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"
    ></script>

    <script>
      window.addEventListener("load", () => {
        const check = setInterval(() => {
          if (
            typeof gsap !== "undefined" &&
            typeof confetti !== "undefined" &&
            typeof lottie !== "undefined" &&
            typeof pako !== "undefined"
          ) {
            clearInterval(check);
            startApp();
          }
        }, 30);
      });

      function startApp() {
        const API_BASE = "/api";
        const MAIN_TGS = "assets/gift.tgs";
        const MAIN_EMOJI = "🎁";
        const MAX_TAPS = 10;
        const ROULETTE_TOTAL = 70;
        const ITEM_W = 96,
          ITEM_GAP = 10,
          ITEM_STEP = 106;

        let PRIZES = [],
          CHANNELS = [],
          USER_STATE = null;

        // Трекер нажатых кнопок «Открыть» для ботов
        const openedBots = new Set();

        const PARTICLE_COUNT = 8;
        const CONFETTI_COUNT = 80;

        // ═══ TGS CACHE ═══
        const tgsRaw = {};
        const tgsString = {};

        try {
          lottie.setQuality(2);
        } catch (e) {}

        async function loadTGS(url) {
          if (tgsRaw[url] !== undefined) return tgsRaw[url];
          try {
            const r = await fetch(url);
            if (!r.ok) throw new Error(r.status);
            const buf = await r.arrayBuffer();
            const json = pako.inflate(new Uint8Array(buf), { to: "string" });
            const parsed = JSON.parse(json);
            tgsRaw[url] = parsed;
            tgsString[url] = json;
            return parsed;
          } catch (e) {
            tgsRaw[url] = null;
            return null;
          }
        }

        function cloneTGS(url) {
          return tgsString[url] ? JSON.parse(tgsString[url]) : null;
        }

        let activeLotties = [];

        function playLottie(container, url, emoji) {
          container.innerHTML = "";
          const data = cloneTGS(url);
          if (data) {
            try {
              const anim = lottie.loadAnimation({
                container,
                renderer: "svg",
                loop: true,
                autoplay: true,
                animationData: data,
              });
              anim.setSubframe(false);
              activeLotties.push(anim);
              return anim;
            } catch (e) {}
          }
          container.textContent = emoji || "🎁";
          return null;
        }

        function killAllLotties() {
          activeLotties.forEach((a) => {
            try {
              a.destroy();
            } catch (e) {}
          });
          activeLotties = [];
        }

        // ═══ API ═══
        function getInitData() {
          try {
            return Telegram.WebApp.initData;
          } catch (e) {
            return "";
          }
        }
        async function api(ep, body = {}) {
          const r = await fetch(`${API_BASE}/${ep}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData: getInitData(), ...body }),
          });
          return r.json();
        }

        function toast(text, type = "error", ms = 3000) {
          const t = document.getElementById("toast");
          t.textContent = text;
          t.className = "toast " + type;
          requestAnimationFrame(() => t.classList.add("show"));
          setTimeout(() => t.classList.remove("show"), ms);
        }

        // ═══ SHAKE ═══
        let shakeAmt = 0,
          shakeFrozen = false,
          shakeRaf = null;
        const mainScene = document.getElementById("main-scene");

        function addShake(a) {
          shakeAmt = Math.min(shakeAmt + a, 45);
          if (!shakeRaf) tickShake();
        }
        function freezeShake(a, ms) {
          shakeAmt = a;
          shakeFrozen = true;
          if (!shakeRaf) tickShake();
          setTimeout(() => (shakeFrozen = false), ms);
        }
        function tickShake() {
          if (shakeAmt < 0.5 && !shakeFrozen) {
            mainScene.style.transform = "";
            shakeRaf = null;
            return;
          }
          const x = ((Math.random() - 0.5) * shakeAmt * 2) | 0;
          const y = ((Math.random() - 0.5) * shakeAmt * 2) | 0;
          mainScene.style.transform = `translate3d(${x}px,${y}px,0)`;
          if (!shakeFrozen) shakeAmt *= 0.85;
          shakeRaf = requestAnimationFrame(tickShake);
        }

        // ═══ PARTICLES ═══
        const particlePool = [];
        const MAX_PARTICLES = 20;

        for (let i = 0; i < MAX_PARTICLES; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          p.style.display = "none";
          document.body.appendChild(p);
          particlePool.push({ el: p, busy: false });
        }

        const PARTICLE_COLORS = ["#FFD700", "#FFA500", "#FF6B6B"];

        function burstCSS(x, y, n) {
          n = Math.min(n, PARTICLE_COUNT);
          let used = 0;
          for (let i = 0; i < particlePool.length && used < n; i++) {
            const slot = particlePool[i];
            if (slot.busy) continue;
            slot.busy = true;
            used++;

            const angle = ((Math.PI * 2) / n) * used + Math.random() * 0.5;
            const dist = 25 + Math.random() * 35;
            const size = 3 + Math.random() * 3;
            const el = slot.el;

            el.style.cssText = `
              left:${x}px;top:${y}px;
              width:${size}px;height:${size}px;
              --dx:${Math.cos(angle) * dist}px;--dy:${Math.sin(angle) * dist}px;
              background:${PARTICLE_COLORS[used % 3]};
              display:block;
            `;
            el.style.animation = "none";
            el.offsetHeight;
            el.style.animation = "";

            setTimeout(() => {
              el.style.display = "none";
              slot.busy = false;
            }, 600);
          }
        }

        // ═══ TAP EFFECTS ═══
        const tapPool = [];
        const MAX_TAP_EFFECTS = 4;
        const TAP_TEXTS = ["+1", "⭐", "✨", "💫"];

        for (let i = 0; i < MAX_TAP_EFFECTS; i++) {
          const el = document.createElement("div");
          el.className = "tap-effect";
          el.style.display = "none";
          document.body.appendChild(el);
          tapPool.push({ el, busy: false });
        }

        function showTapEffect(x, y) {
          for (let i = 0; i < tapPool.length; i++) {
            const slot = tapPool[i];
            if (slot.busy) continue;
            slot.busy = true;

            const el = slot.el;
            el.textContent = TAP_TEXTS[~~(Math.random() * 4)];
            el.style.left = x + (Math.random() - 0.5) * 30 + "px";
            el.style.top = y - 10 + "px";
            el.style.display = "block";
            el.style.animation = "none";
            el.offsetHeight;
            el.style.animation = "";

            setTimeout(() => {
              el.style.display = "none";
              slot.busy = false;
            }, 500);
            return;
          }
        }

        // ═══ ROULETTE ═══
        let winnerPrize = null,
          winnerIndex = 0,
          scrollOffset = 0;
        const liveSlots = new Map();
        const slotPrizes = [];
        const strip = document.getElementById("roulette-strip");
        const itemPool = [];

        function getPoolItem() {
          if (itemPool.length) return itemPool.pop();
          const item = document.createElement("div");
          item.className = "roulette-item";
          const sd = document.createElement("div");
          sd.className = "roulette-sticker";
          item.appendChild(sd);
          return item;
        }

        function returnPool(item, anim) {
          if (anim)
            try {
              anim.destroy();
            } catch (e) {}
          item.firstChild.innerHTML = "";
          item.style.borderColor = "#d0d0d0";
          item.style.boxShadow = "";
          item.style.transform = "";
          strip.removeChild(item);
          itemPool.push(item);
        }

        function initRoulette() {
          for (const [, s] of liveSlots) returnPool(s.el, s.anim);
          liveSlots.clear();
          scrollOffset = 0;
          slotPrizes.length = 0;
          winnerIndex = ROULETTE_TOTAL - Math.floor(Math.random() * 5) - 8;

          const forcedKey = USER_STATE?.forced_prize;
          winnerPrize =
            (forcedKey && PRIZES.find((p) => p.key === forcedKey)) ||
            PRIZES[Math.floor(Math.random() * PRIZES.length)];

          for (let i = 0; i < ROULETTE_TOTAL; i++) {
            slotPrizes[i] =
              i === winnerIndex ? winnerPrize : PRIZES[i % PRIZES.length];
          }
        }

        let lastScroll = -999;
        function updateVisible() {
          const vpW = document.getElementById("roulette-viewport").offsetWidth;
          const center = scrollOffset + vpW / 2;
          for (const [idx, s] of liveSlots) {
            if (!s.anim) continue;
            const itemCenter = 10 + idx * ITEM_STEP + ITEM_W / 2;
            const dist = Math.abs(itemCenter - center);
            if (dist > vpW * 0.6) {
              if (!s.paused) {
                s.anim.pause();
                s.paused = true;
              }
            } else {
              if (s.paused) {
                s.anim.play();
                s.paused = false;
              }
            }
          }
          strip.style.transform = `translate3d(${-scrollOffset}px, 0, 0)`;

          if (Math.abs(scrollOffset - lastScroll) < ITEM_STEP * 0.4) return;
          lastScroll = scrollOffset;

          const first = Math.floor((scrollOffset - 10 - ITEM_W) / ITEM_STEP);
          const last = Math.ceil((scrollOffset + vpW + 10) / ITEM_STEP);
          const vMin = Math.max(0, first),
            vMax = Math.min(ROULETTE_TOTAL - 1, last);

          for (const [idx, s] of liveSlots) {
            if (idx < vMin || idx > vMax) {
              returnPool(s.el, s.anim);
              liveSlots.delete(idx);
            }
          }

          for (let i = vMin; i <= vMax; i++) {
            if (liveSlots.has(i)) continue;
            const prize = slotPrizes[i];
            const item = getPoolItem();
            const sd = item.firstChild;
            sd.innerHTML = "";

            let anim = null;
            const data = cloneTGS(prize.tgs);
            if (data) {
              try {
                anim = lottie.loadAnimation({
                  container: sd,
                  renderer: "svg",
                  loop: true,
                  autoplay: true,
                  animationData: data,
                });
                anim.setSubframe(false);
              } catch (e) {
                sd.innerHTML = `<div class="roulette-emoji">${prize.emoji || "🎁"}</div>`;
              }
            } else {
              sd.innerHTML = `<div class="roulette-emoji">${prize.emoji || "🎁"}</div>`;
            }

            item.style.left = 10 + i * ITEM_STEP + "px";
            strip.appendChild(item);
            liveSlots.set(i, { el: item, anim });
          }
        }

        function spinRoulette() {
          const vpW = document.getElementById("roulette-viewport").offsetWidth;
          const target =
            10 +
            winnerIndex * ITEM_STEP +
            ITEM_W / 2 -
            vpW / 2 +
            (Math.random() - 0.5) * 15;
          const obj = { val: 0 };

          gsap.to(obj, {
            val: target,
            duration: 12,
            ease: "power4.out",
            onUpdate() {
              scrollOffset = obj.val;
              updateVisible();
            },
            onComplete: onStop,
          });
          updateVisible();
        }

        function onStop() {
          lastScroll = -999;
          updateVisible();
          const s = liveSlots.get(winnerIndex);
          if (s) {
            s.el.style.borderColor = "#FFD700";
            s.el.style.boxShadow = "0 0 25px rgba(255,215,0,0.5)";
            gsap.to(s.el, {
              scale: 1.08,
              duration: 0.2,
              yoyo: true,
              repeat: 2,
            });
          }
          document.getElementById("roulette-title").textContent =
            "🎉 Поздравляем!";
          confetti({
            particleCount: CONFETTI_COUNT,
            spread: 80,
            origin: { y: 0.5 },
          });
          api("check-subscription", {
            action: "save_roll",
            prize_key: winnerPrize.key,
            prize_name: winnerPrize.name,
          }).catch(() => {});
          setTimeout(showPrizeModal, 1000);
        }

        // ═══ MODALS ═══
        function showPrizeModal() {
          for (const [, s] of liveSlots)
            if (s.anim) {
              try {
                s.anim.destroy();
                s.anim = null;
              } catch (e) {}
            }
          killAllLotties();

          const ov = document.getElementById("modal-prize");
          document.getElementById("modal-prize-name").textContent =
            winnerPrize.name;
          playLottie(
            document.getElementById("modal-prize-sticker"),
            winnerPrize.tgs,
            winnerPrize.emoji,
          );
          ov.classList.remove("hidden");
          gsap.from(ov.querySelector(".modal-box"), {
            scale: 0.5,
            y: 30,
            opacity: 0,
            duration: 0.4,
            ease: "back.out(1.7)",
          });
          confetti({
            particleCount: 60,
            spread: 60,
            origin: { y: 0.5 },
          });
        }

        document.getElementById("btn-claim").addEventListener("click", () => {
          const ov = document.getElementById("modal-prize");
          gsap.to(ov.querySelector(".modal-box"), {
            scale: 0,
            opacity: 0,
            duration: 0.25,
            onComplete() {
              ov.classList.add("hidden");
              showSubModal();
            },
          });
        });

        function showSubModal() {
          killAllLotties();
          const ov = document.getElementById("modal-subscribe");
          const pName = winnerPrize
            ? winnerPrize.name
            : USER_STATE?.prize_name || "Приз";
          document.getElementById("sub-prize-name").textContent = pName;
          const tUrl = winnerPrize
            ? winnerPrize.tgs
            : PRIZES.find((p) => p.key === USER_STATE?.prize_key)?.tgs;
          const em = winnerPrize
            ? winnerPrize.emoji
            : PRIZES.find((p) => p.key === USER_STATE?.prize_key)?.emoji;
          if (tUrl)
            playLottie(document.getElementById("sub-sticker"), tUrl, em);

          const list = document.getElementById("channel-list");
          list.innerHTML = "";

          CHANNELS.forEach((ch) => {
            const isBot = ch.type === "bot";
            const li = document.createElement("li");
            li.className = "channel-item";

            const avatarIcon = ch.avatar
              ? `<img src="${ch.avatar}" loading="lazy">`
              : isBot
                ? "🤖"
                : "📢";

            const btnText = isBot ? "Открыть" : "Подписаться";

            li.innerHTML = `
              <div class="channel-avatar">${avatarIcon}</div>
              <div class="channel-info">
                <div class="channel-name">${ch.name}</div>
              </div>
              <button class="channel-sub-btn"
                      data-link="${ch.link}"
                      data-type="${ch.type || "channel"}"
                      data-id="${ch.id}">
                ${btnText}
              </button>`;
            list.appendChild(li);
          });

          list.querySelectorAll(".channel-sub-btn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const link = btn.getAttribute("data-link");
              const type = btn.getAttribute("data-type");
              const id = btn.getAttribute("data-id");

              try {
                if (link && link.includes("t.me/"))
                  Telegram.WebApp.openTelegramLink(link);
                else Telegram.WebApp.openLink(link);
              } catch (err) {
                window.open(link, "_blank");
              }

              // Для ботов: отмечаем как открыто
              if (type === "bot" && !openedBots.has(id)) {
                openedBots.add(id);
                btn.textContent = "✓";
                btn.classList.add("done");

                api("check-subscription", {
                  action: "mark_bot_opened",
                  bot_id: id,
                }).catch(() => {});
              }
            });
          });

          ov.classList.remove("hidden");
          gsap.from(ov.querySelector(".modal-box"), {
            scale: 0.5,
            y: 30,
            opacity: 0,
            duration: 0.4,
            ease: "back.out(1.7)",
          });
        }

        document
          .getElementById("btn-check-sub")
          .addEventListener("click", async () => {
            const btn = document.getElementById("btn-check-sub");
            btn.disabled = true;
            btn.querySelector("span").textContent = "Проверяем...";
            try {
              const res = await api("check-subscription", {
                action: "check",
              });
              if (res.all_subscribed) {
                document.querySelectorAll(".channel-sub-btn").forEach((b) => {
                  b.textContent = "✓";
                  b.classList.add("done");
                });
                toast("Подписки подтверждены!", "success");
                await sleep(800);
                const ov = document.getElementById("modal-subscribe");
                gsap.to(ov.querySelector(".modal-box"), {
                  scale: 0,
                  opacity: 0,
                  duration: 0.25,
                  onComplete() {
                    ov.classList.add("hidden");
                    showFinalModal();
                  },
                });
              } else {
                const items = document.querySelectorAll(".channel-item");
                CHANNELS.forEach((ch, i) => {
                  const b = items[i]?.querySelector(".channel-sub-btn");
                  if (b) {
                    const isBot = ch.type === "bot";
                    if (res.results[String(ch.id)]) {
                      b.textContent = "✓";
                      b.classList.add("done");
                    } else {
                      b.textContent = isBot ? "Открыть" : "Подписаться";
                      b.classList.remove("done");
                    }
                  }
                });
                toast("Подпишитесь на все каналы!");
                try {
                  Telegram.WebApp.HapticFeedback.notificationOccurred("error");
                } catch (e) {}
              }
            } catch (e) {
              toast("Ошибка, попробуйте позже");
            }
            btn.disabled = false;
            btn.querySelector("span").textContent = "Проверить подписку";
          });

        function showFinalModal() {
          killAllLotties();
          const ov = document.getElementById("modal-final");
          const pName = winnerPrize
            ? winnerPrize.name
            : USER_STATE?.prize_name || "Приз";
          document.getElementById("final-prize-name").textContent = pName;
          const tUrl = winnerPrize
            ? winnerPrize.tgs
            : PRIZES.find((p) => p.key === USER_STATE?.prize_key)?.tgs;
          const em = winnerPrize
            ? winnerPrize.emoji
            : PRIZES.find((p) => p.key === USER_STATE?.prize_key)?.emoji;
          if (tUrl)
            playLottie(document.getElementById("final-sticker"), tUrl, em);
          ov.classList.remove("hidden");
          gsap.from(ov.querySelector(".modal-box"), {
            scale: 0.5,
            y: 30,
            opacity: 0,
            duration: 0.4,
            ease: "back.out(1.7)",
          });
          confetti({
            particleCount: 100,
            spread: 100,
            origin: { y: 0.5 },
          });
        }

        // ═══ RAYS ═══
        const raysBox = document.getElementById("rays-container");
        for (let i = 0; i < 12; i++) {
          const r = document.createElement("div");
          r.className = "ray";
          r.style.setProperty("--i", i);
          raysBox.appendChild(r);
        }

        // ═══ INIT ═══
        async function init() {
          try {
            Telegram.WebApp.expand();
            Telegram.WebApp.setHeaderColor("#ffffff");
            Telegram.WebApp.setBackgroundColor("#ffffff");
          } catch (e) {}

          try {
            const res = await api("get-user");
            if (res.ok) {
              USER_STATE = res.user;
              CHANNELS = res.channels || [];
              PRIZES = res.prizes || [];
            }
          } catch (e) {
            PRIZES = [
              {
                key: "prize1",
                tgs: "assets/prize1.tgs",
                name: "Scared Cat",
                emoji: "",
              },
              {
                key: "prize2",
                tgs: "assets/prize2.tgs",
                name: "Perfume Bottle",
                emoji: "",
              },
              {
                key: "prize3",
                tgs: "assets/prize3.tgs",
                name: "Mini Oscar",
                emoji: "",
              },
              {
                key: "prize4",
                tgs: "assets/prize4.tgs",
                name: "Kissed Frog",
                emoji: "",
              },
              {
                key: "prize5",
                tgs: "assets/prize5.tgs",
                name: "Swiss Watch",
                emoji: "",
              },
              {
                key: "prize6",
                tgs: "assets/prize6.tgs",
                name: "Signet Ring",
                emoji: "",
              },
              {
                key: "prize7",
                tgs: "assets/prize7.tgs",
                name: "Mad Pumpkin",
                emoji: "",
              },
              {
                key: "prize8",
                tgs: "assets/prize8.tgs",
                name: "Voodoo Doll",
                emoji: "",
              },
              {
                key: "prize9",
                tgs: "assets/prize9.tgs",
                name: "Magic Potion",
                emoji: "",
              },
              {
                key: "prize10",
                tgs: "assets/prize10.tgs",
                name: "Genie Lamp",
                emoji: "",
              },
              {
                key: "prize11",
                tgs: "assets/prize11.tgs",
                name: "Precious Peach",
                emoji: "",
              },
              {
                key: "prize12",
                tgs: "assets/prize12.tgs",
                name: "Astral Shard",
                emoji: "",
              },
              {
                key: "prize13",
                tgs: "assets/prize13.tgs",
                name: "Ion Gem",
                emoji: "",
              },
            ];
          }

          if (!USER_STATE || USER_STATE.state === "new") {
            await loadTGS(MAIN_TGS);
            await Promise.all(PRIZES.map((p) => loadTGS(p.tgs)));
          } else {
            const prizeUrl = PRIZES.find(
              (p) => p.key === USER_STATE.prize_key,
            )?.tgs;
            if (prizeUrl) await loadTGS(prizeUrl);
          }

          const ls = document.getElementById("loading-screen");
          ls.style.opacity = "0";
          setTimeout(() => ls.classList.add("hidden"), 300);

          try {
            Telegram.WebApp.ready();
          } catch (e) {}

          if (USER_STATE?.state === "claimed") {
            showFinalModal();
            return;
          }
          if (USER_STATE?.state === "rolled") {
            winnerPrize =
              PRIZES.find((p) => p.key === USER_STATE.prize_key) || PRIZES[0];
            showSubModal();
            return;
          }

          document.getElementById("main-scene").classList.remove("hidden");
          playLottie(
            document.getElementById("star-container"),
            MAIN_TGS,
            MAIN_EMOJI,
          );

          gsap.from("#star-area", {
            scale: 0,
            duration: 0.8,
            ease: "back.out(1.5)",
          });
          gsap.from("#tap-text", {
            y: 20,
            opacity: 0,
            duration: 0.4,
            delay: 0.5,
          });
          gsap.from("#tap-counter", {
            y: 15,
            opacity: 0,
            duration: 0.3,
            delay: 0.6,
          });
        }

        init();

        // ═══ TAP ═══
        let taps = 0,
          finished = false;
        const starWrapper = document.getElementById("star-wrapper");
        const starEl = document.getElementById("star-container");
        const glowEl = document.getElementById("glow");
        const progressFill = document.getElementById("progress-fill");
        const counterText = document.getElementById("counter-text");

        starWrapper.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          if (finished) return;
          taps++;
          const p = taps / MAX_TAPS;

          try {
            Telegram.WebApp.HapticFeedback.impactOccurred("medium");
          } catch (e) {}

          const sc = 1 + taps * 0.06;
          gsap.to(starEl, {
            scale: sc + 0.12,
            duration: 0.08,
            onComplete: () =>
              gsap.to(starEl, {
                scale: sc,
                duration: 0.2,
                ease: "back.out(2)",
              }),
          });

          gsap.to(glowEl, {
            scale: 1 + p * 0.9,
            opacity: 0.5 + p * 0.5,
            duration: 0.15,
          });

          progressFill.style.width = `${p * 100}%`;
          counterText.textContent = `${taps} / ${MAX_TAPS}`;

          showTapEffect(e.clientX, e.clientY);
          burstCSS(e.clientX, e.clientY, PARTICLE_COUNT);

          if (taps < MAX_TAPS) addShake(2 + taps * 0.5);

          if (taps >= MAX_TAPS) {
            finished = true;
            startFinale();
          }
        });

        // ═══ FINALE ═══
        async function startFinale() {
          freezeShake(25, 3000);

          gsap.to(starEl, {
            scale: 2.2,
            duration: 2.5,
            ease: "power1.in",
          });
          gsap.to(glowEl, { scale: 3, opacity: 1, duration: 2.5 });

          document
            .querySelectorAll(".ray")
            .forEach((r) => (r.style.animation = "none"));
          gsap.to(".ray", { height: 350, opacity: 1, duration: 2.5 });

          await sleep(3000);

          confetti({
            particleCount: 40,
            spread: 50,
            origin: { x: 0.5, y: 0.4 },
          });
          killAllLotties();

          const flash = document.getElementById("flash");
          flash.style.opacity = "1";
          await sleep(1000);

          document.getElementById("main-scene").classList.add("hidden");
          shakeAmt = 0;
          shakeFrozen = false;

          initRoulette();
          document.getElementById("roulette-scene").classList.remove("hidden");
          spinRoulette();

          await sleep(300);
          flash.style.opacity = "0";
        }

        function sleep(ms) {
          return new Promise((r) => setTimeout(r, ms));
        }
      }
    </script>
  </body>
</html>
